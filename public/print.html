<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photobooth · stampe</title>
  <style>
    :root {
      --bg: #0b0b0f; --panel: #16161d; --line: #2a2a35; --text: #f4f4f6; --muted: #9a9aab;
      --ok: #4ade80; --busy: #fbbf24; --error: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
    body { display: grid; grid-template-columns: 1fr minmax(180px, 22vw); height: 100vh; overflow: hidden; }
    main { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; padding: 3vh 2vw; min-width: 0; }
    #current { position: relative; height: 82vh; max-width: 100%; aspect-ratio: 2 / 3; }
    #current img {
      width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 1vh;
      box-shadow: 0 2vh 6vh rgba(0, 0, 0, .6);
    }
    #current img.enter { animation: enter .7s cubic-bezier(.2, 1.2, .4, 1); }
    @keyframes enter { from { opacity: 0; transform: translateY(3vh) scale(.96); } }
    #empty { color: var(--muted); text-align: center; }
    #status { display: flex; align-items: center; gap: 12px; min-height: 32px; }
    .pill { font-weight: 600; font-size: 14px; padding: 4px 12px; border-radius: 999px; border: 1px solid currentColor; }
    .pill.printing, .pill.queued { color: var(--busy); }
    .pill.printed, .pill.saved { color: var(--ok); }
    .pill.failed { color: var(--error); }
    .name { font-size: 20px; font-weight: 600; }
    .muted { color: var(--muted); font-size: 14px; }
    /* progress bar while the printer works */
    #current.printing::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 4px; border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--busy), transparent); background-size: 50% 100%;
      background-repeat: no-repeat; animation: run 1.4s linear infinite;
    }
    @keyframes run { from { background-position: -50% 0; } to { background-position: 150% 0; } }
    aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px; }
    aside h2 { font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 12px; text-transform: uppercase; letter-spacing: .05em; }
    #history { display: grid; gap: 12px; }
    .thumb { border: 2px solid transparent; border-radius: 8px; padding: 0; background: none; color: inherit; cursor: pointer; text-align: left; font: inherit; }
    .thumb.selected { border-color: var(--text); }
    .thumb img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; display: block; border-radius: 6px; background: #000; }
    .thumb span { display: block; padding: 4px 2px 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* classic print dialog: sheet preview on the left, settings and status on the right */
    #dialog {
      --d-bg: #ffffff; --d-text: #1f1f24; --d-muted: #6b6b76; --d-line: #e3e3e8; --d-paper-bg: #dcdce1;
      --d-accent: #1a73e8;
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 3vh 3vw;
      background: rgba(0, 0, 0, .55); opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s;
    }
    #dialog.open { opacity: 1; visibility: visible; transition: opacity .25s; }
    .dialog {
      display: grid; grid-template-columns: minmax(0, 1fr) 340px; width: min(1100px, 100%); height: min(760px, 94vh);
      background: var(--d-bg); color: var(--d-text); border-radius: 10px; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5); transform: translateY(12px) scale(.98); transition: transform .25s;
    }
    #dialog.open .dialog { transform: none; }
    .paper-area { background: var(--d-paper-bg); display: flex; align-items: center; justify-content: center; padding: 32px; min-height: 0; }
    .sheet { height: 100%; max-width: 100%; aspect-ratio: 137.2 / 205.7; background: #fff; box-shadow: 0 2px 12px rgba(0, 0, 0, .25); }
    .sheet img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .settings { display: flex; flex-direction: column; border-left: 1px solid var(--d-line); min-height: 0; }
    .settings header { display: flex; align-items: baseline; justify-content: space-between; padding: 22px 24px 14px; }
    .settings h2 { font-size: 20px; font-weight: 500; margin: 0; }
    .settings dl { margin: 0; padding: 0 24px; flex: 1; overflow-y: auto; }
    .settings dl div { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 13px 0; border-top: 1px solid var(--d-line); font-size: 14px; }
    .settings dt { color: var(--d-muted); }
    .settings dd { margin: 0; overflow-wrap: anywhere; }
    .d-status { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--d-line); font-size: 14px; min-height: 52px; }
    .d-status.failed { color: #c5221f; }
    .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--d-line); border-top-color: var(--d-accent); animation: spin .8s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .check { color: #188038; font-weight: 700; }
    .settings footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 24px 20px; }
    .settings button {
      font: inherit; font-size: 14px; padding: 8px 22px; border-radius: 18px; cursor: pointer;
      border: 1px solid var(--d-line); background: #fff; color: var(--d-accent);
    }
    .settings button.primary { background: var(--d-accent); border-color: var(--d-accent); color: #fff; }
    .settings button:disabled { opacity: .5; cursor: default; }
    @media (max-width: 760px) {
      .dialog { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
      .settings { border-left: 0; border-top: 1px solid var(--d-line); }
      .settings dl { max-height: 30vh; }
    }
    @media (max-width: 700px), (orientation: portrait) {
      body { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; overflow: auto; }
      #current { height: auto; width: min(100%, 60vh); }
      aside { border-left: 0; border-top: 1px solid var(--line); }
      #history { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    }
  </style>
</head>
<body>
  <main>
    <div id="current" hidden><img alt="Anteprima di stampa"></div>
    <p id="empty">In attesa della prima stampa…</p>
    <div id="status"></div>
  </main>
  <aside>
    <h2>Stampe</h2>
    <p id="queue" class="muted" hidden></p>
    <div id="history"></div>
  </aside>
  <div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="dialog">
      <div class="paper-area"><div class="sheet"><img alt="Anteprima del foglio"></div></div>
      <div class="settings">
        <header><h2 id="dialog-title">Stampa</h2><span id="d-sheets" class="muted"></span></header>
        <dl>
          <div><dt>Destinazione</dt><dd id="d-printer"></dd></div>
          <div><dt>Copie</dt><dd id="d-copies"></dd></div>
          <div><dt>Formato carta</dt><dd id="d-paper"></dd></div>
          <div><dt>Orientamento</dt><dd id="d-orientation"></dd></div>
          <div><dt>Bordo</dt><dd id="d-border"></dd></div>
          <div><dt>Margini</dt><dd id="d-margins"></dd></div>
          <div><dt>Adattamento</dt><dd id="d-fit"></dd></div>
          <div><dt>Per</dt><dd id="d-user"></dd></div>
        </dl>
        <div id="d-status" class="d-status" aria-live="polite"></div>
        <footer>
          <button id="d-close" class="primary">Chiudi</button>
        </footer>
      </div>
    </div>
  </div>
  <script src="/static/live.js"></script>
  <script src="/static/print.js"></script>
</body>
</html>
